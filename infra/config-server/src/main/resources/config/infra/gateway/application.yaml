spring:
  cloud:
    gateway:
      default-filters:
        - PrefixPath=/api/v1
      discovery.locator.enabled: true
      routes:
        - id: shopping_cart_service_route
          uri: lb://shopping-cart
          predicates:
            - Path=/shopping-cart/**
        - id: shopping_store_service_route
          uri: lb://shopping-store
          predicates:
            - Path=/shopping-store/**
        - id: warehouse_service_route
          uri: lb://shopping-cart
          predicates:
            - Path=/warehouse/**
        - id: order_service_route
          uri: lo://order
          predicates:
            - Path=/order/**
        - id: delivery_service_route
          uri: lo://delivery
          predicates:
            - Path=/delivery/**
        - id: payment_service_route
          uri: lo://payment
          predicates:
            - Path=/payment/**
server:
  port: 8080